name: build

on:
  push:
    tags:
      - '**'
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish (without the leading v)
        required: true
        default: latest

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Work out the image tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            case "$DISPATCH_TAG" in
              '' | *[!0-9A-Za-z._-]*)
                echo "manual run needs a plain tag, got [$DISPATCH_TAG]" >&2
                exit 1
                ;;
            esac
            echo "version=$DISPATCH_TAG" >> "${GITHUB_OUTPUT}"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUBUNAME }}
          password: ${{ secrets.DOCKERHUBTOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          # No linux/arm/v7: Alpine has shipped no chromium build for armv7
          # since 3.11 (chromium 80, 2020). TODO.md records the route back.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            hvalev/isp-pollution:${{ steps.tag.outputs.version }}
            hvalev/isp-pollution:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # dockerhub-description accepts a Docker Hub personal access token in
      # place of a password, so the same token logs in and updates the
      # description: DOCKERHUBUNAME plus DOCKERHUBTOKEN are the only secrets
      # this workflow needs (the token wants read/write/delete scope).
      - name: Docker Hub Description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUBUNAME }}
          password: ${{ secrets.DOCKERHUBTOKEN }}
          repository: hvalev/isp-pollution
          readme-filepath: ./README.md
