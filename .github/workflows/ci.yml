name: ci

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'docs/**'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      # CI only proves the image builds, so it builds the native arch; the
      # multi-arch image is produced by build.yml on tags.
      - name: Build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: isp-pollution:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
