name: ci

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'docs/**'
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Dependencies, lint, types and tests all come from the lock file, the
      # same lock the image installs from.
      # Full tag: setup-uv publishes v10.3.x, not a floating v10 ref.
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install the locked environment
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run pyright isp_data_pollution.py tests/

      - name: Test
        run: uv run pytest -q

  build:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      # CI only proves the image builds, so it builds the native arch; the
      # multi-arch image is produced by build.yml on tags.
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: isp-pollution:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      # Starting is not enough: the image has to actually generate traffic.
      # The image is already built above, so the script skips its own build.
      - name: Smoke test
        env:
          SKIP_BUILD: '1'
          IMAGE: isp-pollution:ci
          RUN_SECONDS: '150'
          MEASURE_SECONDS: '90'
        run: ./tools/smoke_test.sh
